# =====================================================================================================
# Company-database tools (optional). Active only when COMPANY_DB_DSN is set.
#
# Prefer Enfactum OS API tools (config/os_tools.yaml): they reuse Laravel policies automatically.
# Use these ONLY for data that has no API yet, and connect with a READ-ONLY PostgreSQL role
# (see docs/INTEGRATION_GUIDE.md, section 6B).
#
# Rules enforced at startup: single SELECT/WITH statement, no write/DDL keywords, every %(placeholder)s
# declared in `parameters` (or one of the injected context values below).
#
# Injected automatically (cannot be supplied by the model):
#   %(current_user_id)s     the employee's id from Enfactum OS
#   %(current_user_email)s  the employee's email
#
# Write a literal % as %% (e.g. ILIKE '%%' || %(search)s || '%%').
# Every query MUST enforce access itself (e.g. filter by current_user_id) - the database does not know
# Enfactum's RBAC.
# =====================================================================================================
tools: []

