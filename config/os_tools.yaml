# =====================================================================================================
# Enfactum OS tools (production).
#
# Each entry exposes ONE existing, read-only Enfactum OS endpoint to the assistant. The call is made with the
# end user's own token/cookies, so Laravel middleware, policies and scopes stay the security boundary.
#
# Rules enforced at startup:
#   - method must be GET
#   - path is relative to base_url (no absolute URLs)
#   - parameters must be a valid JSON Schema
#
# Only add endpoints that really exist in Enfactum OS (check `php artisan route:list --path=api`).
# Prefer endpoints that return Laravel API Resources, and list only the fields the assistant needs in
# `response.fields`. Keys that look like secrets (password, token, api_key...) are always redacted.
# =====================================================================================================
base_url: ${OS_BASE_URL}
timeout_seconds: 10

tools: []

